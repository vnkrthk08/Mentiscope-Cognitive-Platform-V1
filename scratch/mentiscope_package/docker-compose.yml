version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mentiscope-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./mentiscope.db
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mentiscope-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: always
