<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d1a" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#0b1329" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#090e1f" stop-opacity="0.95" />
    </linearGradient>

    <!-- Stream Colors -->
    <linearGradient id="medGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="engGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <linearGradient id="lawGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="commGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- Flow Lines Gradients -->
    <linearGradient id="flowMed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.85" />
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="flowEng" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="flowLaw" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.85" />
      <stop offset="60%" stop-color="#fbbf24" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="flowComm" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.85" />
      <stop offset="60%" stop-color="#a855f7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="unifiedBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Filters -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="hubGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Box -->
  <rect width="1000" height="280" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1" />

  <!-- Ambient background glow spots -->
  <circle cx="150" cy="140" r="120" fill="#38bdf8" fill-opacity="0.04" />
  <circle cx="530" cy="140" r="100" fill="#6366f1" fill-opacity="0.08" />
  <circle cx="800" cy="140" r="120" fill="#38bdf8" fill-opacity="0.05" />

  <!-- ================= STREAM BADGES (LEFT) ================= -->

  <!-- 1. Medicine -->
  <g transform="translate(60, 24)">
    <rect x="0" y="0" width="180" height="46" rx="23" fill="#0f172a" fill-opacity="0.8" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.7" />
    <!-- Icon Circle -->
    <circle cx="23" cy="23" r="16" fill="#10b981" fill-opacity="0.15" />
    <!-- Stethoscope / Cross -->
    <path d="M 23 15 L 23 31 M 15 23 L 31 23" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" />
    <!-- Label -->
    <text x="50" y="28" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" letter-spacing="0.2">Medicine</text>
    <!-- Right Connector Dot -->
    <circle cx="180" cy="23" r="4.5" fill="#10b981" />
  </g>

  <!-- 2. Engineering -->
  <g transform="translate(60, 84)">
    <rect x="0" y="0" width="180" height="46" rx="23" fill="#0f172a" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.7" />
    <!-- Icon Circle -->
    <circle cx="23" cy="23" r="16" fill="#38bdf8" fill-opacity="0.15" />
    <!-- Gear / Compass -->
    <path d="M 23 15 L 23 31 M 15 23 L 31 23 M 17 17 L 29 29 M 17 29 L 29 17" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <circle cx="23" cy="23" r="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8" />
    <!-- Label -->
    <text x="50" y="28" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" letter-spacing="0.2">Engineering</text>
    <!-- Right Connector Dot -->
    <circle cx="180" cy="23" r="4.5" fill="#38bdf8" />
  </g>

  <!-- 3. Law -->
  <g transform="translate(60, 144)">
    <rect x="0" y="0" width="180" height="46" rx="23" fill="#0f172a" fill-opacity="0.8" stroke="#fbbf24" stroke-width="1.2" stroke-opacity="0.7" />
    <!-- Icon Circle -->
    <circle cx="23" cy="23" r="16" fill="#fbbf24" fill-opacity="0.15" />
    <!-- Scales of Justice -->
    <path d="M 23 15 L 23 31 M 16 19 L 30 19 M 16 19 L 13 25 M 19 25 L 16 19 M 13 25 L 19 25 M 30 19 L 27 25 M 33 25 L 30 19 M 27 25 L 33 25" stroke="#fbbf24" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Label -->
    <text x="50" y="28" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" letter-spacing="0.2">Law</text>
    <!-- Right Connector Dot -->
    <circle cx="180" cy="23" r="4.5" fill="#fbbf24" />
  </g>

  <!-- 4. Commerce & Humanities -->
  <g transform="translate(60, 204)">
    <rect x="0" y="0" width="180" height="46" rx="23" fill="#0f172a" fill-opacity="0.8" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.7" />
    <!-- Icon Circle -->
    <circle cx="23" cy="23" r="16" fill="#a855f7" fill-opacity="0.15" />
    <!-- Trending / Growth Icon -->
    <path d="M 16 28 L 21 22 L 25 25 L 30 17 M 30 17 L 26 17 M 30 17 L 30 21" stroke="#a855f7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Label -->
    <text x="50" y="28" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" letter-spacing="0.2">Commerce &amp; Arts</text>
    <!-- Right Connector Dot -->
    <circle cx="180" cy="23" r="4.5" fill="#a855f7" />
  </g>

  <!-- ================= FLOW PATHS CONVERGING ================= -->

  <!-- Flow 1: Medicine -> Hub -->
  <path d="M 240 47 C 370 47, 430 137, 520 137" fill="none" stroke="url(#flowMed)" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="360" cy="72" r="3" fill="#10b981" filter="url(#softGlow)" />

  <!-- Flow 2: Engineering -> Hub -->
  <path d="M 240 107 C 350 107, 420 137, 520 137" fill="none" stroke="url(#flowEng)" stroke-width="2.8" stroke-linecap="round" />
  <circle cx="370" cy="116" r="3" fill="#38bdf8" filter="url(#softGlow)" />

  <!-- Flow 3: Law -> Hub -->
  <path d="M 240 167 C 350 167, 420 137, 520 137" fill="none" stroke="url(#flowLaw)" stroke-width="2.8" stroke-linecap="round" />
  <circle cx="370" cy="158" r="3" fill="#fbbf24" filter="url(#softGlow)" />

  <!-- Flow 4: Commerce -> Hub -->
  <path d="M 240 227 C 370 227, 430 137, 520 137" fill="none" stroke="url(#flowComm)" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="360" cy="202" r="3" fill="#a855f7" filter="url(#softGlow)" />

  <!-- Convergence Focal Point (Glowing Hub) -->
  <g transform="translate(520, 137)">
    <circle cx="0" cy="0" r="16" fill="#6366f1" fill-opacity="0.3" filter="url(#hubGlow)" />
    <circle cx="0" cy="0" r="8" fill="#6366f1" />
    <circle cx="0" cy="0" r="4" fill="#ffffff" />
  </g>

  <!-- Unified Outflow Beam -> Report -->
  <path d="M 528 137 L 610 137" stroke="url(#unifiedBeam)" stroke-width="4" stroke-linecap="round" filter="url(#softGlow)" />
  <polygon points="610,131 622,137 610,143" fill="#38bdf8" />

  <!-- ================= ONE CLEAR REPORT (RIGHT) ================= -->
  <g transform="translate(640, 36)">
    <!-- Report Outer Glowing Border -->
    <rect x="-4" y="-4" width="308" height="212" rx="20" fill="#6366f1" fill-opacity="0.08" filter="url(#hubGlow)" />
    
    <!-- Report Main Card -->
    <rect x="0" y="0" width="300" height="204" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.2" />

    <!-- Card Header -->
    <g transform="translate(18, 16)">
      <!-- Document Icon -->
      <rect x="0" y="0" width="34" height="34" rx="8" fill="#38bdf8" fill-opacity="0.15" />
      <path d="M 11 8 L 19 8 L 23 12 L 23 26 L 11 26 Z" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 14 15 L 20 15 M 14 19 L 18 19" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
      
      <!-- Titles -->
      <text x="44" y="15" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">Stream Fit Report</text>
      <text x="44" y="29" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500">Your optimal career fit</text>
    </g>

    <!-- Divider -->
    <line x1="18" y1="62" x2="282" y2="62" stroke="#1e293b" stroke-width="1" />

    <!-- Identified Fit Highlight -->
    <g transform="translate(18, 74)">
      <rect x="0" y="0" width="264" height="52" rx="10" fill="#1e293b" fill-opacity="0.8" stroke="#3b82f6" stroke-width="1" />
      
      <text x="12" y="20" fill="#93c5fd" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" letter-spacing="0.5">BEST MATCHED STREAM</text>
      <text x="12" y="40" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800">Engineering &amp; Tech</text>

      <rect x="194" y="10" width="58" height="30" rx="6" fill="#2563eb" />
      <text x="223" y="30" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800">94%</text>
    </g>

    <!-- Bottom Verification & Tagline -->
    <g transform="translate(18, 140)">
      <rect x="0" y="0" width="264" height="42" rx="8" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-width="0.8" />
      <circle cx="18" cy="21" r="8" fill="#10b981" fill-opacity="0.2" />
      <path d="M 14 21 L 17 24 L 22 18" fill="none" stroke="#10b981" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      <text x="34" y="25" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600">Many paths, one clear answer.</text>
    </g>
  </g>
</svg>
