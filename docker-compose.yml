services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend/mentiscope.db:/app/mentiscope.db
    environment:
      - DATABASE_URL=sqlite:////app/mentiscope.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - PORT=5173
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped
