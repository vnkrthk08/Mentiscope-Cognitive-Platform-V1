        escalations: ["lead investor cuts pitch time to 90 seconds", "demo unit battery fails on stage"]
      "Resource Allocation":
        events: ["trademark name similarity flag", "unit economics margin error", "cofounder equity share dispute"]
        constraints: ["initial seed grant limit", "first customer delivery date", "competitor product release"]
        escalations: ["legal advisor warns of trademark infringement risk", "cofounder threatens to leave startup"]
    equipment: ["prototype demo unit", "pitch deck clicker", "projection screen", "sample packaging box"]
    stakeholders: ["angel investor", "incubator director", "faculty mentor", "lead customer", "cofounder"]
    resources: ["financial model spreadsheet", "customer survey data", "patent search draft"]
    missing_resources: ["functional prototype spare part", "signed non-disclosure agreement"]
    failure_risks: ["loss of seed funding", "missed launch window", "team dissolution"]
    reflection_themes: ["communicating value under extreme time constraints", "evaluating risk versus reward in early ventures"]
  "E-Commerce & Digital Ventures":
